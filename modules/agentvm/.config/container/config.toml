# The container service reads this file at its start, so a change takes
# effect after `container system stop` and `container system start`.
# Reference: https://github.com/apple/container/blob/main/docs/container-system-config.md

# The agentvm image is Arch Linux ARM, so builds need no x86 emulation.
[build]
memory = "8g"
rosetta = false

[container]
cpus = 4
memory = "8g"

# ── Agents ────────────────────────────────────────────
# Every coding agent across tmux sessions. Claude Code reports state from a
# hook and pi from an extension. Both inherit TMUX_PANE from the pane the
# agent runs in, which maps the state back to its pane. The binding runs
# through `fish -c` so conf.d builds PATH.

# @key tmux-tools :: a :: Agent picker (all sessions)
bind a display-popup -w 90% -h 85% -E "fish -c agents"

# The agent VM, as on WezTerm's leader, where the agentvm package is
# deployed. `agents vm` copies the current repository into the VM.
if-shell 'test -x ~/.local/libexec/agentvm/agentvm' {
  # @key tmux-tools :: v :: Repository copy in the agent VM, new window
  bind v new-window -c '#{pane_current_path}' "fish -c 'agents vm shell'"
  # @key tmux-tools :: A :: Claude Code in the agent VM, new window
  bind A new-window -c '#{pane_current_path}' "fish -c 'agents vm claude'"
}

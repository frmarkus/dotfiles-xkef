command_timeout = 1000

format = """
${env_var.PROMPT_AGENTVM}\
${env_var.PROMPT_DIRNAME}\
$character"""

right_format = """
$directory\
$vcs\
$python"""

[directory]
truncation_length = 8
truncate_to_repo = false
fish_style_pwd_dir_length = 1
truncation_symbol = '…/'
style = 'dimmed cyan'

# In colocated repos jj comes first, so the git modules, with a detached
# " HEAD" and duplicate status counts, render only outside jj repos.
[vcs]
order = ['jj', 'git']
git_modules = '$git_branch$git_status$git_metrics'
jj_modules = '$jj_change$jj_bookmark$jj_status$jj_metrics'

[git_branch]
format = '[$symbol$branch]($style) '
symbol = ' '
style = 'purple'

[git_status]
format = '($stashed$staged$modified$untracked$conflicted$ahead_behind)'
stashed = '[*${count}](yellow) '
staged = '[+${count}](green) '
modified = '[!${count}](red) '
untracked = '[?${count}](blue) '
conflicted = '[=${count}](bold red) '
ahead = '[⇡${count}](green) '
behind = '[⇣${count}](red) '
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bold red) '

[git_metrics]
disabled = false
added_style = 'green'
deleted_style = 'red'

# Shows only an active virtualenv, without a version probe. Toolchain
# versions are one `mise current` away.
[python]
format = '([$symbol$virtualenv]($style) )'
symbol = ' '
detect_extensions = []
detect_files = []
generic_venv_names = ['.venv', 'venv']

[jj_change]
format = '[ ](purple)$change '
prefix_style = 'bold purple'
suffix_style = 'purple'
change_hash_length = 8

[jj_bookmark]
format = '[$bookmark(@$remote)$diverged( +$overflow_count)]($style) '
style = 'purple'

[jj_metrics]
added_style = 'green'
deleted_style = 'red'

[jj_status]
format = '($all)'
conflicted = '[⚠ ](bold red)'
description_empty = ''
immutable = '[◆ ](yellow)'
added = '[+${count}](green) '
copied = '[=${count}](green) '
deleted = '[-${count}](red) '
modified = '[!${count}](red) '
renamed = '[»${count}](yellow) '

# The shield that WezTerm and the picker put on agent VM panes, in the
# VM itself, which the image marks with /etc/agentvm. Fish sets these
# variables in tools.fish, because a custom module spawns a shell on every
# prompt.
[env_var.PROMPT_AGENTVM]
symbol = ' '
style = 'bold yellow'
format = '[$symbol]($style)'

[env_var.PROMPT_DIRNAME]
format = '[$env_value](bold cyan) '
